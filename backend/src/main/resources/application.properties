spring.application.name=faker-blue
server.port=8080
faker.auth.admin.username=${FAKER_BLUE_ADMIN_USERNAME:host}
faker.auth.admin.password=${FAKER_BLUE_ADMIN_PASSWORD:}
faker.websocket.allowed-origin-patterns=${FAKER_BLUE_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
